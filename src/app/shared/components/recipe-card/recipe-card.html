<article class="recipe-card" *ngIf="recipe">
  <div class="image-slider">
    <swiper-container
      #swiperRef
      class="image-slider detail"
      loop="true"
      grab-cursor="true"
      allow-touch-move="true"
      effect="fade"
      fade-effect='{"crossFade": true}'
      navigation="true"
      pagination='{"clickable": true}'
      observer="true"
      observe-parents="true"
    >
      <swiper-slide *ngFor="let img of images">
        <img [src]="img" [alt]="recipe.title" class="slider-image" />
      </swiper-slide>
    </swiper-container>

    <button
      *ngIf="showLikeButton"
      class="like-btn like-counter"
      [class.active]="isFavorite"
      (click)="toggleLike($event)"
      aria-label="Me gusta"
    >
      <span class="heart">♥</span>
      <span class="count">{{ likesCount }}</span>
    </button>

    <div class="bottom-buttons" *ngIf="showShareButton">
      <button class="share-icon" aria-label="Compartir" (click)="copyLink()">
        <img src="assets/images/share.webp" alt="Compartir" />
      </button>
      <span class="copy-msg" *ngIf="copied">¡Link copiado!</span>
    </div>
  </div>

  <div class="card-content">
    <h1 class="title" [ngClass]="{ 'large-title': titleSize === 'large' }">
      {{ recipe.title }}
    </h1>
    <p class="card-text">
      <span class="star-text">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="#FFD700"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.54 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"
          />
        </svg>
        {{ shortText }}<span *ngIf="showEllipsis">…</span>
      </span>
    </p>

    <div class="author">
      <img [src]="'assets/images/yo.webp'" alt="Autor" class="avatar" />
      <div class="author-info">
        <span class="author-name">{{ recipe.author?.name }}</span>
        <a class="author-link" [routerLink]="['/author-recipes', recipe.author?.id]"
          >Ver sus recetas</a
        >
      </div>
    </div>
  </div>

  <div class="recipe-actions" *ngIf="showRemoveFavorite">
    <button type="button" (click)="removeFavorite()" class="remove-btn">
      ❌ Quitar de favoritos
    </button>
  </div>

  <a class="view-recipe-full" [routerLink]="['/recipe', recipe.id]">Ver receta</a>
</article>
