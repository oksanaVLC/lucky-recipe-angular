<article class="recipe-card" *ngIf="recipe">
  <div class="image-slider">
    <swiper-container
      #swiperRef
      class="image-slider detail"
      loop="true"
      grab-cursor="true"
      allow-touch-move="true"
      effect="fade"
      fade-effect='{"crossFade": true}'
      navigation="true"
      pagination='{"clickable": true}'
      observer="true"
      observe-parents="true"
    >
      <swiper-slide *ngFor="let img of images">
        <img [src]="img" [alt]="recipe.title" class="slider-image" />
      </swiper-slide>
    </swiper-container>

    <button
      *ngIf="showLikeButton"
      class="like-btn like-counter"
      [class.active]="isFavorite"
      (click)="toggleLike($event)"
      aria-label="Me gusta"
    >
      <span class="heart">♥</span>
      <span class="count">{{ likesCount }}</span>
    </button>

    <div class="bottom-buttons" *ngIf="showShareButton">
      <button class="share-icon" aria-label="Compartir" (click)="copyLink()">
        <img src="assets/images/share.webp" alt="Compartir" />
      </button>
      <span class="copy-msg" *ngIf="copied">¡Link copiado!</span>
    </div>
  </div>

  <div class="card-content">
    <h1 class="title" [ngClass]="{ 'large-title': titleSize === 'large' }">
      {{ recipe.title }}
    </h1>

    <div class="stars">
      <ng-container *ngIf="recipe.rating !== undefined; else noRating">
        <i
          *ngFor="let star of getStars(recipe.rating)"
          class="bi"
          [ngClass]="{
            'bi-star-fill': star === 'full',
            'bi-star-half': star === 'half',
            'bi-star': star === 'empty',
          }"
        ></i>
        <span class="rating-number">{{ recipe.rating.toFixed(1) }}</span>
      </ng-container>

      <ng-template #noRating>
        <i *ngFor="let star of [1, 2, 3, 4, 5]" class="bi bi-star"></i>
      </ng-template>
    </div>

    <p class="card-text">"{{ shortText }}<span *ngIf="showEllipsis">…</span>"</p>

    <div class="author">
      <img [src]="'assets/images/yo3.png'" alt="Autor" class="avatar" />
      <div class="author-info">
        <span class="author-name">{{ recipe.author?.name }}</span>
        <a class="author-link" [routerLink]="['/author-recipes', recipe.author?.id]">Ver recetas</a>
      </div>
    </div>
  </div>

  <div class="recipe-actions" *ngIf="showRemoveFavorite">
    <button type="button" (click)="removeFavorite()" class="remove-btn">
      ❌ Quitar de favoritos
    </button>
  </div>

  <a class="view-recipe-full" [routerLink]="['/recipe', recipe.id]">Ver receta</a>
</article>
